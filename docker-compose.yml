# Development stack for aKom-Pliss.
# Only the API service is defined in Phase 0. The commented services are
# added in later phases as their runtimes are integrated.

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      LOG_LEVEL: info
    ports:
      - "3000:3000"

